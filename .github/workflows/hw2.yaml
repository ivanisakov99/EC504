name: HW2 - Priority Queues & String Matching

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Build programme
        run: make -C '2. Priority Queues & String Matching' all
      - name: Run heapmoves
        run: cd '2. Priority Queues & String Matching' && ./heapmoves
      - name: Run KMP
        run: cd '2. Priority Queues & String Matching' && ./KMP
